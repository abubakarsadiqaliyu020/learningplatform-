<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | EduLearn</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>


<body class="auth-body">


<!-- ================= HEADER ================= -->

<header class="auth-header">

    <div class="container">

        <a href="../index.html" class="logo">
            EduLearn
        </a>

        <a href="login.html" class="back-home">
            ← Back to Login
        </a>

    </div>

</header>



<!-- ================= FORGOT PASSWORD ================= -->

<main class="login-section">

    <div class="simple-auth-container">

        <div class="simple-auth-card">

            <div class="login-card-heading">

                <span>
                    ACCOUNT RECOVERY
                </span>

                <h2>
                    Forgot Password?
                </h2>

                <p>
                    Enter your User ID and registered email address
                    to request assistance with your account.
                </p>

            </div>


            <form id="forgotPasswordForm">


                <div class="auth-form-group">

                    <label for="userId">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="userId"
                        placeholder="Enter your User ID"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="email">
                        Registered Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Request Password Assistance
                </button>


                <p
                    id="forgotMessage"
                    class="login-message"
                ></p>


            </form>


            <div class="login-help">

                <p>
                    Remember your password?
                </p>

                <a href="login.html">
                    Return to Login
                </a>

            </div>

        </div>

    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="auth-footer">

    <p>
        © 2026 EduLearn. All Rights Reserved.
    </p>

</footer>



<script>

const forgotForm =
    document.getElementById("forgotPasswordForm");

const forgotMessage =
    document.getElementById("forgotMessage");


forgotForm.addEventListener("submit", function(event) {

    event.preventDefault();


    forgotMessage.textContent =
        "Your request has been recorded. Please contact the administrator for assistance.";

    forgotForm.reset();

});

</script>


</body>

</html>
